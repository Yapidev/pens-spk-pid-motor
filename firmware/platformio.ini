; PlatformIO Project Configuration File (Opsional — sketch juga langsung kompatibel dengan Arduino IDE)
; Gunakan `pio run -e uno -t upload` atau `pio run -e mega2560 -t upload`

[platformio]
src_dir = pens_pid_motor

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/LiquidCrystal@^1.0.7

[env:mega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/LiquidCrystal@^1.0.7
