; PlatformIO Project Configuration File (Opsional — sketch juga langsung kompatibel dengan Arduino IDE)
; Gunakan `pio run -e due -t upload` (default Modul Praktikum PENS), `uno`, atau `mega2560`

[platformio]
src_dir = pens_pid_motor
default_envs = due

[env:due]
platform = atmelsam
board = due
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/LiquidCrystal@^1.0.7

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_flags = -DBOARD_PROFILE_PENS_DUE=0
lib_deps =
    arduino-libraries/LiquidCrystal@^1.0.7

[env:mega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags = -DBOARD_PROFILE_PENS_DUE=0
lib_deps =
    arduino-libraries/LiquidCrystal@^1.0.7
